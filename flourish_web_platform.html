        const initialLeads = [
            { id: 1, name: "Pranav Sharma", phone: "9876543210", email: "pranav@gmail.com", service: "Mutual Funds SIP", amount: "₹15,000/mo", date: "Just now", status: "New" },
            { id: 2, name: "Siddharth Roy", phone: "9123456789", email: "siddharth.r@outlook.com", service: "Insurance Planning", amount: "₹10,00,000 Life", date: "2 hours ago", status: "Contacted" },

        const initialFunds = [
            { name: "Flourish Bluechip Growth Fund", category: "Equity - Large Cap", return3Y: "18.4%", risk: "Very High", rating: "★★★★★", minSip: 500 },
            { name: "Flourish Midcap Multiplier Fund", category: "Equity - Mid Cap", return3Y: "24.6%", risk: "Very High", rating: "★★★★★", minSip: 1000 },
            { name: "Flourish SafeHaven Debt Fund", category: "Debt - Low Duration", return3Y: "7.8%", risk: "Moderate", rating: "★★★★☆", minSip: 500 },
            { name: "Flourish Dynamic Asset Allocator", category: "Hybrid", return3Y: "14.2%", risk: "High", rating: "★★★★★", minSip: 1000 },
            { name: "Flourish ELSS Tax Saver Plan", category: "Equity - Tax Saving", return3Y: "19.1%", risk: "Very High", rating: "★★★★☆", minSip: 500 }

        const defaultPortfolio = [
            { id: 1, name: "Flourish Bluechip Fund", type: "Equity", value: 120000 },
            { id: 2, name: "Sovereign Gold Bond Series V", type: "Gold", value: 45000 },
            { id: 3, name: "SafeHaven Debt Fund", type: "Debt", value: 65000 },

        function App() {
            const [view, setView] = useState('client'); // 'client' or 'advisor'
            const [clientTab, setClientTab] = useState('home'); // 'home', 'portfolio', 'sip-calc', 'goals', 'funds', 'insurance', 'loans-fd', 'contact'
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            
            // CRM/Leads States
            const [leads, setLeads] = useState(() => {
                const storedLeads = localStorage.getItem('flourish_leads');
                return storedLeads ? JSON.parse(storedLeads) : initialLeads;
            });
            const [formSubmitted, setFormSubmitted] = useState(false);
            const [customAlert, setCustomAlert] = useState(null);

            // Portfolio state
            const [portfolioItems, setPortfolioItems] = useState(defaultPortfolio);
            const [newAssetName, setNewAssetName] = useState('');
            const [newAssetType, setNewAssetType] = useState('Equity');
            const [newAssetValue, setNewAssetValue] = useState('');

            // SIP Predictor state
            const [sipAmount, setSipAmount] = useState(10000);
            const [sipYears, setSipYears] = useState(15);
            const [sipRate, setSipRate] = useState(12.5);

            // Goal planning states
            const [targetGoal, setTargetGoal] = useState('Retirement Corpus');
            const [targetAmount, setTargetAmount] = useState(25000000);
            const [targetTime, setTargetTime] = useState(20);

            // Loans & Fixed Deposits states
            const [loanAmount, setLoanAmount] = useState(1500000);
            const [loanRate, setLoanRate] = useState(8.5);
            const [loanTenure, setLoanTenure] = useState(5);

            const [fdAmount, setFdAmount] = useState(200000);
            const [fdRate, setFdRate] = useState(7.25);
            const [fdTenure, setFdTenure] = useState(3);

            // Insurance Questionnaire states
            const [familyType, setFamilyType] = useState('family-kids');
            const [userIncome, setUserIncome] = useState(1200000);
            const [currentLiabilities, setCurrentLiabilities] = useState(4000000);

            // Contact states
            const [contactName, setContactName] = useState('');
            const [contactPhone, setContactPhone] = useState('');
            const [contactEmail, setContactEmail] = useState('');
            const [contactInterest, setContactInterest] = useState('Mutual Funds SIP');
            const [contactAmount, setContactAmount] = useState('10000');

            // Save leads to localStorage whenever updated
            useEffect(() => {
                localStorage.setItem('flourish_leads', JSON.stringify(leads));
            }, [leads]);

            // Flash helper alert
            const showAlert = (message, type = 'success') => {
                setCustomAlert({ message, type });
                setTimeout(() => setCustomAlert(null), 4000);
            };

            const { investedAmount, totalValue, futureGain } = useMemo(() => {
                const P = sipAmount;
                const r = (sipRate / 100) / 12;
                const n = sipYears * 12;
                
                const calculatedTotal = P * ((Math.pow(1 + r, n) - 1) / r) * (1 + r);
                const calculatedInvested = P * n;
                const calculatedGain = Math.max(0, calculatedTotal - calculatedInvested);

                return {
                    investedAmount: Math.round(calculatedInvested),
                    totalValue: Math.round(calculatedTotal),
                    futureGain: Math.round(calculatedGain)
                };
            }, [sipAmount, sipYears, sipRate]);

            // Chart point coordinate computation for visual growth plotting
            const chartPoints = useMemo(() => {
                const points = [];
                const P = sipAmount;
                const r = (sipRate / 100) / 12;
                const totalSteps = Math.min(sipYears, 30);
                
                for (let year = 0; year <= totalSteps; year++) {
                    const n = year * 12;
                    let val = n > 0 ? P * ((Math.pow(1 + r, n) - 1) / r) * (1 + r) : 0;
                    points.push({ year, value: val });
                }

                const maxVal = points[points.length - 1]?.value || 10000;
                const chartHeight = 150;
                const chartWidth = 400;

                return points.map((p, i) => {
                    const x = (i / totalSteps) * chartWidth;
                    const y = chartHeight - ((p.value / maxVal) * (chartHeight - 20)) - 10;
                    return `${x},${y}`;
                }).join(' ');
            }, [sipAmount, sipYears, sipRate]);

            const portfolioStats = useMemo(() => {
                const totalVal = portfolioItems.reduce((acc, curr) => acc + Number(curr.value), 0);
                const categories = { Equity: 0, Debt: 0, Gold: 0, "Cash/FD": 0 };
                
                portfolioItems.forEach(item => {
                    if (categories[item.type] !== undefined) {
                        categories[item.type] += Number(item.value);
                    }
                });

                return {
                    totalValue: totalVal,
                    categories,
                    ratios: Object.keys(categories).reduce((acc, key) => {
                        acc[key] = totalVal > 0 ? Math.round((categories[key] / totalVal) * 100) : 0;
                        return acc;
                    }, {})
                };
            }, [portfolioItems]);

            // Loan EMI Calculations
            const loanEmi = useMemo(() => {
                const P = loanAmount;
                const r = (loanRate / 100) / 12;
                const n = loanTenure * 12;
                if (r === 0) return Math.round(P / n);
                const emi = (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                const totalPayout = emi * n;
                return {
                    monthly: Math.round(emi),
                    totalInterest: Math.round(totalPayout - P),
                    totalPayment: Math.round(totalPayout)
                };
            }, [loanAmount, loanRate, loanTenure]);

            // FD compounding calculations (Compounded Quarterly)
            const fdReturn = useMemo(() => {
                const P = fdAmount;
                const r = fdRate / 100;
                const t = fdTenure;
                const n = 4; // quarterly
                const finalAmt = P * Math.pow(1 + (r / n), n * t);
                return {
                    maturity: Math.round(finalAmt),
                    interestEarned: Math.round(finalAmt - P)
                };
            }, [fdAmount, fdRate, fdTenure]);

            // Reverse Goal compounder SIP estimation
            const requiredGoalSip = useMemo(() => {
                const target = targetAmount;
                const years = targetTime;
                const rate = 12; // Standard long-term conservative return
                const r = (rate / 100) / 12;
                const n = years * 12;

                const multiplier = ((Math.pow(1 + r, n) - 1) / r) * (1 + r);
                return multiplier > 0 ? Math.round(target / multiplier) : 0;
            }, [targetAmount, targetTime]);

            // Insurance diagnostics formula

                                                                type="number"

                                                                onChange={(e) => setFdTenure(Number(e.target.value))}
                                                                className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm text-slate-800 focus:outline-none focus:ring-1 focus:ring-brand-blue"
                                                            />
                                                        </div>
                                                    </div>

                                                            <span className="text-slate-750 font-semibold">₹{fdAmount.toLocaleString('en-IN')}</span>
                                                        </div>
                                                        <div className="flex justify-between text-slate-600">
                                                            <span>Interest Earned (Compounded Quarterly):</span>
                                                            <strong className="text-brand-greenDark">₹{fdReturn.interestEarned.toLocaleString('en-IN')}</strong>
                                                        </div>
                                                        <div className="flex justify-between text-slate-600 border-t border-slate-200 pt-2 font-bold">
                                                            <span>Maturity Yield Balance:</span>
                                                            <span className="text-brand-blueDark text-sm">₹{fdReturn.maturity.toLocaleString('en-IN')}</span>
                                                        </div>
                                                    </div>

                                                    <button 
                                                        onClick={() => {
                                                            setContactInterest('Fixed Deposit Placement');
                                                            setContactAmount(`₹${fdAmount.toLocaleString('en-IN')} FD`);

                                                        }}
                                                        className="w-full bg-white hover:bg-slate-50 text-slate-700 font-bold text-xs p-3 rounded-lg transition border border-slate-200"

                                                        Review Competitive Corporate Rates

                                                                    type="text" 
                                                                    required
                                                                    value={contactName}
                                                                    onChange={(e) => setContactName(e.target.value)}

                                                                    required
                                                                    value={contactPhone}
                                                                    onChange={(e) => setContactPhone(e.target.value)}
                                                                    placeholder="e.g. 9876543210" 
                                                                    className="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm text-slate-800 focus:outline-none focus:ring-1 focus:ring-brand-blue"

                                                                <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Interest Category</label>

                                                                    value={contactInterest}

                                                                    <option value="Term Insurance Plan">Term Insurance Cover</option>
                                                                    <option value="Goal Assessment">Child Goals / Retirement</option>
                                                                    <option value="Fixed Income FD">Fixed Deposits & Bonds</option>
                                                                    <option value="Loan Structuring">Loan Structuring / EMI Audit</option>
                                                                </select>
                                                            </div>

                                                            <div>
                                                                <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Intended Budget Size (₹)</label>
                                                                <input 
                                                                    type="text" 
                                                                    value={contactAmount}
                                                                    onChange={(e) => setContactAmount(e.target.value)}
                                                                    placeholder="e.g. 15000" 
                                                                    className="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm text-slate-800 focus:outline-none focus:ring-1 focus:ring-brand-blue"
                                                                />
                                                            </div>
                                                        </div>

                                                        <div className="pt-2">
                                                            <button 
                                                                type="submit" 
                                                                className="w-full bg-brand-blue hover:bg-brand-blueDark text-white font-extrabold p-3.5 rounded-lg text-xs transition uppercase tracking-widest shadow-md shadow-brand-blue/15"
                                                            >
                                                                Submit Registration Setup
                                                            </button>
                                                        </div>
                                                    </form>
                                                )}

                                        </div>
                                    </div>

                                        <div className="inline-flex items-center space-x-2 bg-brand-blue/10 border border-brand-blue/20 px-3 py-1 rounded-full text-brand-blueDark text-xs font-semibold">

                                            <span className="h-1.5 w-1.5 rounded-full bg-brand-green animate-pulse"></span>
                                        </div>
                                        <h2 className="text-3xl font-black text-brand-blueDark mt-1 font-serif">Avinash Chandra's Console</h2>

                                                <div className="space-y-1">
                                                    <div className="flex items-center space-x-2">
                                                        <span className="font-bold text-slate-800 text-sm">{lead.name}</span>
                                                        <span className={`text-[9px] px-2.5 py-0.5 rounded-full font-extrabold uppercase ${
                                                            lead.status === 'New' ? 'bg-brand-blue/10 text-brand-blueDark' :
                                                            lead.status === 'Contacted' ? 'bg-brand-green/10 text-brand-greenDark' :
                                                            'bg-slate-200 text-slate-700'
                                                        }`}>
                                                            {lead.status}
                                                        </span>
                                                    </div>
                                                    <div className="flex flex-wrap gap-x-4 text-xs text-slate-500 font-semibold">
                                                        <span>📞 {lead.phone}</span>
                                                        <span>✉ {lead.email}</span>
                                                        <span>🗓 {lead.date}</span>

                                                <div className="flex items-center space-x-4 w-full md:w-auto justify-between md:justify-end">

                                                        <p className="text-[9px] text-slate-400 font-bold uppercase">Requested Target Scheme</p>
                                                        <p className="text-xs font-bold text-slate-700">{lead.service} ({lead.amount})</p>
                                                    </div>

                                                    <div className="flex space-x-1.5">
                                                        <button 
                                                            onClick={() => {
                                                                const updated = leads.map(l => l.id === lead.id ? {...l, status: 'Contacted'} : l);
                                                                setLeads(updated);
                                                                showAlert("Lead status updated to Contacted.");
                                                            }}
                                                            className="text-[10px] bg-white hover:bg-slate-50 text-slate-700 font-extrabold px-2.5 py-1.5 rounded-lg border border-slate-200 transition"
                                                        >
                                                            Contacted
                                                        </button>
                                                        <button 
                                                            onClick={() => {
                                                                const updated = leads.filter(l => l.id !== lead.id);
                                                                setLeads(updated);
                                                                showAlert("Lead removed from system scope.");
                                                            }}
                                                            className="text-[10px] bg-rose-50 hover:bg-rose-100 text-rose-700 font-extrabold px-2.5 py-1.5 rounded-lg border border-rose-200 transition"
                                                        >
                                                            Archive
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}

                                        {leads.length === 0 && (
                                            <div className="p-8 text-center text-slate-400 italic text-xs">No entries recorded in consultation pipeline.</div>
                                        )}
                                    </div>
                                </div>
                            </div>

                    </main>

                    {/* Compliant Footer with updated Address & ARN details */}
                    <footer className="bg-white border-t border-slate-100 py-10 text-xs text-slate-600 shadow-inner">

                            {/* Footer Left Area */}
                            <div className="md:col-span-5 space-y-4">
                                <div className="flex items-center space-x-3">
                                    <div className="h-8 w-8 bg-white border border-slate-100 p-0.5 rounded-lg shadow-sm flex items-center justify-center">
                                        <FIAISLogo className="w-6 h-6" />
                                    </div>
                                    <span className="font-extrabold text-brand-blueDark text-sm uppercase tracking-wider font-serif">Flourish Advisory</span>
                                </div>
                                <p className="max-w-xs leading-relaxed text-slate-500 font-semibold">
                                    Strategic advisory distribution structures managed by Avinash Chandra. Compliance metrics align meticulously with current AMFI indices guidelines.
                                </p>
                            </div>

                            {/* Footer Middle Links */}
                            <div className="md:col-span-3 space-y-2">
                                <h5 className="font-extrabold text-brand-blueDark uppercase tracking-widest text-[10px]">Strategic Modules</h5>
                                <div className="flex flex-col space-y-1.5 font-semibold text-slate-500">
                                    <button onClick={() => { setView('client'); setClientTab('portfolio'); }} className="text-left hover:text-brand-blue transition">AUM Portfolio Tracker</button>
                                    <button onClick={() => { setView('client'); setClientTab('sip-calc'); }} className="text-left hover:text-brand-blue transition">Compounding Predictor</button>
                                    <button onClick={() => { setView('client'); setClientTab('goals'); }} className="text-left hover:text-brand-blue transition font-semibold">Goal Milestone Planner</button>
                                    <button onClick={() => { setView('client'); setClientTab('loans-fd'); }} className="text-left hover:text-brand-blue transition font-semibold">Loans & FD Optimizer</button>
                                </div>
                            </div>

                            {/* Footer Disclosures */}
                            <div className="md:col-span-4 space-y-2">
                                <h5 className="font-extrabold text-brand-blueDark uppercase tracking-widest text-[10px]">Regulatory Disclosures</h5>
                                <p className="leading-relaxed text-[10px] text-slate-400">
                                    Mutual Fund investment routes are subject to continuous volatility. Please review prospectus materials prior to positioning capital resources. Insurance solicitation parameters represent subject matter of solicitation.
                                </p>
                                <p className="text-[10px] text-brand-greenDark font-extrabold uppercase tracking-wider">
                                    Plan • Invest • Protect • Flourish ✨
                                </p>
                            </div>
                        </div>
                    </footer>

        // Render application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
